apiVersion: apps/v1
kind: Deployment
metadata:
  name: tier-1-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: employee-frontend:latest
          ports:
            - containerPort: 80


